<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — ZTE Tracker</title>
  <style>
    :root {
      --background: #0e0e0d;
      --surface: #171715;
      --border: #2b2b27;
      --foreground: #f1f0ec;
      --muted: #8a8880;
      --accent: #ff6a2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--foreground);
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.04); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>This page hasn't been loaded yet</h1>
    <p>You're offline, and this route hasn't been visited before while online, so there's nothing cached to show. Pages you've already opened will still work — try the dashboard or a page you were on recently.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
